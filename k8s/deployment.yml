apiVersion: apps/v1
kind: Deployment
metadata:
  name: biofire-mpc
  namespace: biofire
  labels:
    app: biofire-mpc
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: biofire-mpc
  template:
    metadata:
      labels:
        app: biofire-mpc
    spec:
      serviceAccountName: biofire-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: biofire
          image: biofire-mpc:v6.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: NODE_ENV
              value: "production"
            - name: BIOFIRE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: biofire-secrets
                  key: api-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: biofire-secrets
                  key: redis-url
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: biofire-secrets
                  key: database-url
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /api/v6/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v6/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
        - name: data
          persistentVolumeClaim:
            claimName: biofire-data
