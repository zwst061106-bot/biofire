name: Security Scan

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]

# تمت إضافة هذه الكتلة لحل مشكلة الصلاحيات (Error: Resource not accessible)
permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: typescript
      - uses: github/codeql-action/analyze@v3

  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # تم التحديث لتجنب تحذير تقادم الإصدار 20
      - run: npm ci
      - run: npm audit --audit-level=high
